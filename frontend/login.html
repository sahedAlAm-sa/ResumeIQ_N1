<!doctype html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1">

  <title>ResumeIQ Login</title>

  <link
    rel="stylesheet"
    href="/css/style.css">

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar">

  <!-- Logo -->
  <a
    href="index.html"
    class="logo-link">

    <img
      src="images/logo.png"
      alt="ResumeIQ Logo"
      class="app-logo">

  </a>


  <!-- Navigation -->

  <ul class="nav-links">

    <li>
      <a href="index.html">
        Home
      </a>
    </li>

    <li>
      <a href="analyzer.html">
        Analyzer
      </a>
    </li>

    <li>
      <a href="jobs.html">
        Jobs
      </a>
    </li>

    <li>
      <a href="dashboard.html">
        Dashboard
      </a>
    </li>

  </ul>


  <!-- Theme Toggle -->

  <button
    id="theme-toggle"
    class="theme-btn"
    aria-label="Toggle Theme">

    <span id="theme-icon">
      🌙
    </span>

  </button>

</nav>

<!-- ================= END NAVBAR ================= -->


<!-- ================= LOGIN ================= -->

<main class="auth-page">

  <div class="auth-card">

    <div class="eyebrow">
      WELCOME BACK
    </div>


    <h1>
      Log in
    </h1>


    <p class="muted">
      Access your ResumeIQ dashboard.
    </p>


    <!-- Message -->

    <div
      id="msg"
      class="message">
    </div>


    <!-- Email -->

    <label>
      Email
    </label>

    <input
      id="email"
      class="form-control"
      type="email"
      placeholder="Email"
      autocomplete="email">


    <!-- Password -->

    <label>
      Password
    </label>

    <input
      id="password"
      class="form-control"
      type="password"
      placeholder="Password"
      autocomplete="current-password">


    <!-- Login Button -->

    <button
      id="loginBtn"
      class="btn-primary full"
      onclick="login()">

      Login

    </button>


    <!-- Signup -->

    <p class="auth-bottom muted">

      No account?

      <a href="/signup.html">
        Create one
      </a>

    </p>


    <!-- Demo Account -->

    <p class="muted">
      Demo: user@resumeiq.com / user123
    </p>

  </div>

</main>

<!-- ================= END LOGIN ================= -->


<!-- ================= JAVASCRIPT ================= -->

<script>

async function login() {

  const m =
    document.getElementById("msg");

  const btn =
    document.getElementById("loginBtn");


  btn.disabled = true;

  btn.innerHTML =
    '<span class="spinner-border spinner-border-sm" aria-hidden="true"></span> Signing in...';


  const r = await fetch(
    "/api/auth/login",
    {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({

        email:
          document.getElementById("email").value,

        password:
          document.getElementById("password").value

      })
    }
  );


  const d = await r.json();


  if (!r.ok) {

    m.textContent =
      d.message;

    m.className =
      "message error";

    btn.disabled =
      false;

    btn.textContent =
      "Login";

    return;

  }


  localStorage.setItem(
    "resumeiqUser",
    JSON.stringify(d.user)
  );


  location.href =
    "/dashboard.html";

}

</script>


<!-- Bootstrap JS -->

<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>
</html>
