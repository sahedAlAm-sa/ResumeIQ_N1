<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ResumeIQ</title>

  <link rel="stylesheet" href="/css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

  <!-- নতুন Navbar এখানে বসবে -->
  <nav class="navbar">

    <!-- Logo -->
    <a href="index.html" class="logo-link">
      <img src="images/logo.png" alt="ResumeIQ Logo" class="app-logo">
    </a>

    <!-- Light/Dark Theme Toggle -->
    <button id="theme-toggle" class="theme-btn" aria-label="Toggle Theme">
      <span id="theme-icon">🌙</span>
    </button>

  </nav>


  <!-- Main Content -->
  <main class="hero">
    <div class="container">
      <div class="cardx">

        <div class="eyebrow">
          AI RESUME ANALYZER & JOB PORTAL
        </div>

        <h1>
          Build a better career with <span>ResumeIQ.</span>
        </h1>

        <p class="muted">
          Analyze your resume, discover skill gaps and find matching jobs in one platform.
        </p>

        <a class="btn-primary" href="/signup.html">
          Get Started
        </a>

        <a class="btn-primary" href="/jobs.html">
          Explore Jobs
        </a>

      </div>
    </div>
  </main>


  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>const themeToggleBtn = document.getElementById('theme-toggle');
const themeIcon = document.getElementById('theme-icon');

// পূর্বের সেভ করা থিম চেক
if (localStorage.getItem('theme') === 'dark') {
  document.body.classList.add('dark-mode');
  themeIcon.textContent = '☀️';
}

themeToggleBtn.addEventListener('click', () => {
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  
  themeIcon.textContent = isDark ? '☀️' : '🌙';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}); </script>
</body>
</html>
