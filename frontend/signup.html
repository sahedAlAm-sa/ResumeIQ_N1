<!doctype html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1">

  <title>ResumeIQ — Sign Up</title>

  <link
    rel="stylesheet"
    href="/css/style.css">

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar">

  <!-- Logo -->
  <a
    href="index.html"
    class="logo-link">

    <img
      src="images/logo.png"
      alt="ResumeIQ Logo"
      class="app-logo">

  </a>


  <!-- Navigation -->

  <ul class="nav-links">

    <li>
      <a href="index.html">
        Home
      </a>
    </li>

    <li>
      <a href="analyzer.html">
        Analyzer
      </a>
    </li>

    <li>
      <a href="jobs.html">
        Jobs
      </a>
    </li>

    <li>
      <a href="dashboard.html">
        Dashboard
      </a>
    </li>

  </ul>


  <!-- Theme Toggle -->

  <button
    id="theme-toggle"
    class="theme-btn"
    aria-label="Toggle Theme">

    <span id="theme-icon">
      🌙
    </span>

  </button>

</nav>

<!-- ================= END NAVBAR ================= -->


<!-- ================= SIGN UP ================= -->

<main class="auth-page">

  <div class="auth-card">

    <div class="eyebrow">
      START YOUR JOURNEY
    </div>


    <h1>
      Create your account
    </h1>


    <p class="muted">
      Join ResumeIQ to analyze your resume and discover better job opportunities.
    </p>


    <form
      id="signupForm"
      novalidate>


      <!-- Full Name -->

      <label for="signupName">
        Full Name
      </label>

      <input
        id="signupName"
        type="text"
        placeholder="Enter your full name">


      <!-- Email -->

      <label for="signupEmail">
        Email
      </label>

      <input
        id="signupEmail"
        type="email"
        placeholder="Enter your email">


      <!-- Password -->

      <label for="signupPassword">
        Password
      </label>

      <input
        id="signupPassword"
        type="password"
        placeholder="Minimum 6 characters">


      <!-- Confirm Password -->

      <label for="confirmPassword">
        Confirm Password
      </label>

      <input
        id="confirmPassword"
        type="password"
        placeholder="Re-enter your password">


      <!-- Message -->

      <div
        id="signupMessage"
        class="message">
      </div>


      <!-- Create Account Button -->

      <button
        id="signupBtn"
        type="submit"
        class="btn-primary full">

        Create Account

      </button>

    </form>


    <!-- Login Link -->

    <p class="auth-bottom muted">

      Already have an account?

      <a href="/login.html">
        Log in
      </a>

    </p>

  </div>

</main>

<!-- ================= END SIGN UP ================= -->


<!-- ================= JAVASCRIPT ================= -->

<script>

document
  .getElementById("signupForm")
  .addEventListener(
    "submit",
    async function(e) {

      e.preventDefault();


      const btn =
        document.getElementById("signupBtn");

      const name =
        document
          .getElementById("signupName")
          .value
          .trim();

      const email =
        document
          .getElementById("signupEmail")
          .value
          .trim();

      const password =
        document
          .getElementById("signupPassword")
          .value;

      const confirmPassword =
        document
          .getElementById("confirmPassword")
          .value;

      const msg =
        document.getElementById(
          "signupMessage"
        );


      msg.className =
        "message";


      <!-- Validation -->

      if (
        !name ||
        !email ||
        !password ||
        !confirmPassword
      ) {

        msg.textContent =
          "Please fill in all fields.";

        msg.className =
          "message error";

        return;

      }


      if (
        password !== confirmPassword
      ) {

        msg.textContent =
          "Passwords do not match.";

        msg.className =
          "message error";

        return;

      }


      if (
        password.length < 6
      ) {

        msg.textContent =
          "Password must be at least 6 characters.";

        msg.className =
          "message error";

        return;

      }


      try {

        btn.disabled = true;

        btn.innerHTML =
          '<span class="spinner-border spinner-border-sm" aria-hidden="true"></span> Creating account...';


        const r = await fetch(
          "/api/auth/register",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              name: name,
              email: email,
              password: password
            })
          }
        );


        const d =
          await r.json();


        if (!r.ok) {

          msg.textContent =
            d.message ||
            "Registration failed.";

          msg.className =
            "message error";

          btn.disabled =
            false;

          btn.textContent =
            "Create Account";

          return;

        }


        localStorage.setItem(
          "resumeiqUser",
          JSON.stringify(d.user)
        );


        msg.textContent =
          "Account created successfully! Redirecting...";

        msg.className =
          "message success";


        setTimeout(
          () =>
            location.href =
              "/dashboard.html",
          700
        );


      } catch (err) {

        btn.disabled =
          false;

        btn.textContent =
          "Create Account";

        msg.textContent =
          "Server connection failed. Make sure npm start is running.";

        msg.className =
          "message error";

      }

    }
  );

</script>


<!-- Bootstrap JS -->

<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>
</html>
