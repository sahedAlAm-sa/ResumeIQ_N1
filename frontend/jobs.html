<!doctype html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1">

  <title>ResumeIQ Jobs</title>

  <link
    rel="stylesheet"
    href="/css/style.css">

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar">

  <!-- Logo -->
  <a
    href="index.html"
    class="logo-link">

    <img
      src="images/logo.png"
      alt="ResumeIQ Logo"
      class="app-logo">

  </a>


  <!-- Navigation -->

  <ul class="nav-links">

    <li>
      <a href="index.html">
        Home
      </a>
    </li>

    <li>
      <a href="analyzer.html">
        Analyzer
      </a>
    </li>

    <li>
      <a href="jobs.html">
        Jobs
      </a>
    </li>

    <li>
      <a href="dashboard.html">
        Dashboard
      </a>
    </li>

  </ul>


  <!-- Theme Toggle -->

  <button
    id="theme-toggle"
    class="theme-btn"
    aria-label="Toggle Theme">

    <span id="theme-icon">
      🌙
    </span>

  </button>

</nav>

<!-- ================= END NAVBAR ================= -->


<!-- ================= JOB PORTAL ================= -->

<main class="hero">

  <div class="container">

    <div class="cardx">

      <h1>
        Job Portal
      </h1>


      <!-- Search -->

      <div class="input-group input-group-lg">

        <span
          class="input-group-text"
          style="background:rgba(8,3,17,.4);color:var(--gold);border-color:rgba(230,210,255,.28)">

          ⌕

        </span>


        <input
          id="q"
          class="form-control"
          placeholder="Search by job, company or skill..."
          oninput="load()">

      </div>


      <!-- Job List -->

      <div
        id="list"
        style="margin-top:25px">

      </div>

    </div>

  </div>

</main>

<!-- ================= END JOB PORTAL ================= -->


<!-- ================= JAVASCRIPT ================= -->

<script>

const u = JSON.parse(
  localStorage.getItem("resumeiqUser") || "null"
);


async function load() {

  const d = await (
    await fetch(
      "/api/jobs?q=" +
      encodeURIComponent(q.value)
    )
  ).json();


  list.innerHTML = d.map(j =>

    '<div class="feature" style="margin:15px 0">' +

      '<h2>' +
        j.title +
      '</h2>' +

      '<p class="muted">' +
        j.company +
        ' · ' +
        j.location +
        ' · ' +
        j.job_type +
      '</p>' +

      '<p>' +
        j.description +
      '</p>' +

      '<p>' +

        j.required_skills.map(s =>

          '<span class="pill">' +
            s +
          '</span>'

        ).join("") +

      '</p>' +


      '<button ' +
        'class="btn-primary" ' +
        'onclick="apply(' +
          j.id +
        ')"' +
      '>' +

        'Apply' +

      '</button>' +

    '</div>'

  ).join("");

}


async function apply(jobId) {

  if (!u) {

    location.href = "/login.html";

    return;

  }


  const d = await (

    await fetch(
      "/api/applications",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          userId: u.id,
          jobId: jobId
        })
      }
    )

  ).json();


  alert(d.message);

}


load();

</script>


<!-- Bootstrap JS -->

<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>
</html>
